[package]
name = "isled"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Isled — a personal issue ledger"
repository = "https://github.com/cark/isled"

[[bin]]
name = "isled"
path = "src/main.rs"

[[example]]
name = "graph-layout"
path = "src/graph_layout/preview.rs"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
icu_casemap = "2.2.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
smallvec = "1.16.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
