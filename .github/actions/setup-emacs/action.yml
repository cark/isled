name: Full Emacs for native acceptance
description: Install the pinned editor with built-in TLS and decompression.
runs:
  using: composite
  steps:
    - if: runner.os != 'Windows'
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
    - name: Install pinned full Emacs on Linux and macOS
      if: runner.os != 'Windows'
      shell: bash
      run: |
        revision=$(python -c 'import json; print(json.load(open("flake.lock"))["nodes"]["nixpkgs"]["locked"]["rev"])')
        editor=$(nix build --no-link --print-out-paths "github:NixOS/nixpkgs/$revision#emacs-nox")
        echo "$editor/bin" >> "$GITHUB_PATH"
    - if: runner.os == 'Windows'
      uses: jcs090218/setup-emacs-windows@3ad415b5f6575fe0bb8218cb35c199a93b1fb833
      with:
        version: '30.1'
    - name: Verify native installer capabilities
      shell: bash
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
            print('ISLED_CHECK_PACKAGE_DIR=' + (Path(os.environ['RUNNER_TEMP']) / 'isled-check-packages').as_posix(), file=output)
        PY
        emacs -Q --batch --eval '(progn (require (quote gnutls)) (unless (and (fboundp (quote zlib-available-p)) (zlib-available-p) (gnutls-available-p)) (error "Installer acceptance needs built-in TLS and zlib")) (princ (format "%s\n%s\n%s\n" (emacs-version) system-configuration system-configuration-features)))'
